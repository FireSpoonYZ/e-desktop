[package]
name = "e-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "e_desktop"
crate-type = ["lib"]

[[bin]]
name = "e-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-global-shortcut"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# lane: rules-spawn-screenshot (window rule matches/excludes; already in Cargo.lock)
regex = "1"
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-global-shortcut = { version = "2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Imaging", "Win32_System_Com_StructuredStorage"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_System_LibraryLoader", "Win32_Storage_Xps", "Win32_Devices_HumanInterfaceDevice", "Win32_UI_Input", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr", "shape"] }
