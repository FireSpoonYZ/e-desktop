[package]
name = "window-handoff-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Stage 0 is independent of the product workspace.
[workspace]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Performance",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Storage_Xps",
] }
